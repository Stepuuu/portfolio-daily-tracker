services:
  # Portfolio Dashboard Backend (FastAPI)
  backend:
    build:
      context: ./dashboard
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./engine/portfolio:/app/portfolio
      - dashboard-data:/app/data
    environment:
      - PORTFOLIO_DIR=/app/portfolio
      - TRACKER_CONFIG_FILE=/app/data/config.json
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  # Portfolio Dashboard Frontend (React + Vite)
  frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Portfolio Engine — run manually or via scheduler
  # Usage: docker compose run engine python scripts/portfolio_snapshot.py
  engine:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: engine/Dockerfile
    volumes:
      - ./engine/portfolio:/app/portfolio
    working_dir: /app

volumes:
  dashboard-data:
