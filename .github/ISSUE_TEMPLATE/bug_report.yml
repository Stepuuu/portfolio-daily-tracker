name: Bug report / 问题反馈
description: Help reproduce a problem using fictional data.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result / 操作步骤与预期
      description: Include a minimal fictional example. Do not share real holdings or credentials.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, OS, Python, Node, Docker / 运行环境
