server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # nginx rejects request bodies over 1 MB by default (HTTP 413). The backend accepts more:
    # the ledger CSV import takes 2,000,000 characters inside JSON (several MB once non-ASCII
    # text is encoded and escaped), the research-lab dataset import takes 8 MB, and chat takes
    # several screenshots per message. 20m covers all of them; the backend enforces its own limits.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        # Chat replies are server-sent events: pass each chunk through as it arrives.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
